name: Atualizar destaques do blog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: blog-destaques
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    # Só ativar após conceder acesso de Leitor à conta de serviço no GA4.
    if: github.ref == 'refs/heads/main' && vars.BLOG_GA4_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}'
      - name: Instalar dependências do coletor
        run: python -m pip install -r scripts/requirements-blog.txt
      - name: Coletar visualizações dos artigos
        run: python scripts/atualizar-destaques-blog.py
      - name: Salvar somente o feed agregado
        run: |
          git add data/blog/destaques.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "blog: atualizar seis destaques com dados do GA4"
          git push
